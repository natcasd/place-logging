# fly.toml app configuration file generated for place-logging on 2026-04-25T21:19:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'place-logging'
primary_region = 'ewr'

[build]

[processes]
  app = 'uvicorn firebase_service:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log'

[env]
  JOT_ACCOUNT_DB_PATH = '/data/jot-accounts.sqlite'
  FIREBASE_PROJECT_ID = 'jot-app-20260915'
  JOT_PROCESSING_VERSION = 'public-v1'
  GOOGLE_APPLICATION_CREDENTIALS = '/run/secrets/firebase-admin.json'
  WORKDIR = '/tmp/place-logger-downloads'

[[files]]
  guest_path = '/run/secrets/firebase-admin.json'
  secret_name = 'JOT_FIREBASE_ADMIN_CREDENTIAL'
  processes = ['app']

[[mounts]]
  source = 'placedata'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep the single API/SQLite machine ready so the app avoids Fly cold starts.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
