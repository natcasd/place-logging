name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v0/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python generate_ios_entry_types.py --check
      - run: python -m unittest discover --start-directory tests --verbose
      - run: python -m compileall -q .

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Test account transport and response contracts
        run: swift test --package-path ios
      - name: Verify Firebase client configuration
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Firebase/GoogleService-Info.plist)" = "com.natcasd.placelogger"
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/Firebase/GoogleService-Info.plist)" = "jot-app-20260915"
          reversed_client_id="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/Firebase/GoogleService-Info.plist)"
          grep -Fq "GOOGLE_REVERSED_CLIENT_ID = ${reversed_client_id}" ios/Config/Base.xcconfig
      - name: Build app and share extension without signing
        run: >-
          xcodebuild
          -project ios/PlaceLogger.xcodeproj
          -scheme PlaceLogger
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
