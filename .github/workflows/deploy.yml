name: Deploy to Fly.io

on:
  workflow_dispatch:

concurrency:
  group: place-logging-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Require successful CI for the selected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ci_state=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$DEPLOY_SHA" --limit 1 --json status,conclusion \
            --jq '.[0] | "\(.status):\(.conclusion)"')
          if [[ "$ci_state" != "completed:success" ]]; then
            echo "::error::CI must finish successfully for $DEPLOY_SHA before deployment. Current state: $ci_state"
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-08-12
      - name: Deploy existing single-machine app
        working-directory: v0
        run: flyctl deploy --remote-only --ha=false --update-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
